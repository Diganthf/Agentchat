name: Keep Render Alive 24/7

on:
  schedule:
    # Backup pinger. GitHub cron is best-effort and often delayed several minutes,
    # so treat an external monitor (UptimeRobot / cron-job.org) as the primary
    # 5-minute keep-alive and this as redundancy.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping AgentChat Render Health Endpoint
        run: |
          curl -s -f -m 30 "https://agentchat-1jpo.onrender.com/api/health" || echo "Ping completed"
