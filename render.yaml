services:
  - type: web
    name: agentchat
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "5050"
      - key: HOST
        value: "0.0.0.0"
      - key: DISABLE_LOCAL_TOOLS
        value: "1"
      - key: BASE_TIER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
